name: "🚴 Retour terrain"
description: "Corrections / ajustements notés pendant une sortie de test"
title: "[Terrain] "
labels: ["terrain"]
body:
  - type: dropdown
    id: categorie
    attributes:
      label: Catégorie
      description: Pour trier au retour au PC
      options:
        - carte
        - altitude
        - pause-auto
        - batterie
        - live / partage
        - UI / ergonomie
        - crash / bug
        - autre
    validations:
      required: true

  - type: textarea
    id: quoi
    attributes:
      label: Quoi
      description: Ce que tu as observé
      placeholder: "Ex : la trace saute de 40 m après une pause au col X"
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Attendu
      description: Ce qui aurait dû se passer (optionnel)
    validations:
      required: false

  - type: input
    id: contexte
    attributes:
      label: Contexte
      description: Sortie / lieu / heure — repère pour retrouver la trace
      placeholder: "Ex : sortie du 26/07 ~14h30, montée du col de Menté"
    validations:
      required: false

  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: Glisse une capture d'écran ou une photo ici (optionnel)
    validations:
      required: false
